{{- if and .Values.ingress.enabled .Values.ingress.traefik.enabled }}
{{- range $name, $spec := .Values.ingress.traefik.middlewares }}
---
apiVersion: {{ include "common.capabilities.traefik.apiVersion" $ }}
kind: Middleware
metadata:
  name: {{ $name }}
  namespace: {{ include "common.names.namespace" $ | quote }}
  labels: {{ include "common.labels.standard" $ | nindent 4 }}
spec: {{- include "common.tplvalues.render" (dict "value" $spec "context" $) | nindent 2 }}
{{- end }}
{{- end }}
