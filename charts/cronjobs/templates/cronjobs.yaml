{{- $allCronJobs := default (dict) .Values.cronjobs -}}
{{- $namePrefix := (include "common.names.fullname" .) }}
{{- range $key, $value := $allCronJobs }}

---
apiVersion: {{ include "common.capabilities.cronjob.apiVersion" $ }}
kind: CronJob
metadata:
  name: {{ printf "%s-%s" $namePrefix $key | trunc 52 | trimSuffix "-"}}
  namespace: {{ include "common.names.namespace" $ | quote }}
  labels: {{ include "common.labels.standard" $ | nindent 4 }}
    app.kubernetes.io/component: cronjob
  {{- if $value.annotations }}
  annotations: {{ toYaml $value.annotations | indent 4 }}
  {{- end }}
spec:
  schedule: {{ $value.schedule | quote }}
  {{- with $value.timeZone }}
  timeZone: {{ . | quote }}
  {{- end }}
  suspend: {{ $value.suspend | default false }}
  concurrencyPolicy: {{ $value.concurrencyPolicy | default "Forbid" }}

  {{- if $value.startingDeadlineSeconds }}
  startingDeadlineSeconds: {{ $value.startingDeadlineSeconds }}
  {{- end }}

  failedJobsHistoryLimit: {{ $value.failedJobsHistoryLimit | default 3 }}
  successfulJobsHistoryLimit: {{ $value.successfulJobsHistoryLimit | default 1 }}

  jobTemplate:
    spec:
      backoffLimit: {{ $value.backoffLimit | default 6  }}
      {{- with $value.activeDeadlineSeconds }}
      activeDeadlineSeconds: {{ . }}
      {{- end }}
      {{- with $value.ttlSecondsAfterFinished }}
      ttlSecondsAfterFinished: {{ . }}
      {{- end }}
      template:
        metadata:
          labels: {{ include "common.labels.matchLabels" $ | nindent 12 }}
        spec:
          {{- if $.Values.podSecurityContext }}
          securityContext: {{ toYaml $.Values.podSecurityContext | nindent 12 }}
          {{- end }}
          {{- if $.Values.hostPid }}
          hostPID: {{ $.Values.hostPid }}
          {{- end }}
          {{- if $.Values.affinity }}
          affinity: {{- include "common.tplvalues.render" (dict "value" $.Values.affinity "context" $) | nindent 12 }}
          {{- else }}
          affinity:
            {{- if has $.Values.podAffinity.preset (list "soft" "hard") }}
            podAffinity: {{- include "common.affinities.pods" (dict "type" $.Values.podAffinity.preset "topologyKey" $.Values.podAffinity.topologyKey "context" $) | nindent 14 }}
            {{- end }}
            {{- if has $.Values.podAntiAffinity.preset (list "soft" "hard") }}
            podAntiAffinity: {{- include "common.affinities.pods" (dict "type" $.Values.podAntiAffinity.preset "topologyKey" $.Values.podAntiAffinity.topologyKey "context" $) | nindent 14 }}
            {{- end }}
            {{- if $.Values.nodeAffinityPreset.type }}
            nodeAffinity: {{- include "common.affinities.nodes" (dict "type" $.Values.nodeAffinityPreset.type "key" $.Values.nodeAffinityPreset.key "values" $.Values.nodeAffinityPreset.values) | nindent 14 }}
            {{- end }}
          {{- end }}
          {{- if $.Values.nodeSelector }}
          nodeSelector: {{ toYaml $.Values.nodeSelector | nindent 12 }}
          {{- end }}
          {{- if $.Values.tolerations }}
          tolerations: {{ toYaml $.Values.tolerations | nindent 12 }}
          {{- end }}
          restartPolicy: "Never"
          serviceAccountName: {{ include "common.serviceAccount.name" $ }}
          {{- if kindIs "bool" $.Values.serviceAccount.automountServiceAccountToken }}
          automountServiceAccountToken: {{ $.Values.serviceAccount.automountServiceAccountToken }}
          {{- end }}
          {{- include "common.images.renderPullSecrets" (dict "images" (list) "context" $) | nindent 10 }}
          containers:
            - name: {{ $key }}
              image: "{{ include "common.images.image"  $ }}"
              imagePullPolicy: {{ $.Values.global.image.pullPolicy }}
              {{- with merge (default dict $value.securityContext) (default dict $.Values.securityContext) }}
              securityContext: {{ toYaml . | nindent 16 }}
              {{- end }}
              env:
                {{- /* Kubernetes expands $(VAR) only against earlier entries; keep values last so they can reference secrets. */}}
                {{- include "cronjobs.job.vaultSecret" (dict "jobName" $key "job" $value "global" $) | indent 16 }}
                {{- include "cronjobs.globalenv.value" $ | indent 16 }}
                {{- include "cronjobs.job.value" $value | indent 16 }}
              {{- if or $.Values.envFrom $.Values.configMap.enabled }}
              envFrom:
                {{- if $.Values.configMap.enabled }}
                - configMapRef:
                    name: {{ include "common.names.fullname" $ }}
                {{- end }}
                {{- with $.Values.envFrom }}
                {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 16 }}
                {{- end }}
              {{- end }}
              {{- if $value.command }}
              command: {{- toYaml $value.command | nindent 16 }}
              {{- end }}
              {{- if $value.args }}
              args: {{ toYaml $value.args | nindent 16 }}
              {{- end }}
              {{- $resources := merge (default dict $value.resources) (default dict $.Values.resources) }}
              {{- if or $resources.limits $resources.requests }}
              resources: {{ toYaml $resources | nindent 16 }}
              {{- else if and $.Values.resourcesPreset (ne $.Values.resourcesPreset "none") }}
              resources: {{- include "common.resources.preset" (dict "type" $.Values.resourcesPreset) | nindent 16 }}
              {{- end }}
              {{- if $.Values.volumes }}
              volumeMounts: {{- include "common.volume.mounts" $ | trim | nindent 16 }}
              {{- end }}
          {{- if $.Values.volumes }}
          volumes: {{- include "common.volume.definitions" $ | nindent 12 }}
          {{- end }}
{{- end }}
