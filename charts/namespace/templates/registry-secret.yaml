{{- with .Values.registrySecret }}
{{- if .enabled }}
---
apiVersion: {{ include "common.capabilities.externalSecret.apiVersion" $ }}
kind: ExternalSecret
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ .refreshInterval }}
  secretStoreRef:
    name: {{ $.Values.global.secretStore | quote }}
    kind: ClusterSecretStore
  target:
    name: {{ .name }}
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"{{ .server }}":{"username":"{{ "{{ .username }}" }}","password":"{{ "{{ .password }}" }}","auth":"{{ "{{ .auth }}" }}"}}}'
  dataFrom:
    - extract:
        key: {{ .remoteKey }}
{{- end }}
{{- end }}
