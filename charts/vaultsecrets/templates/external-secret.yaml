{{- $allKubeSecrets := default (dict) .Values.kubeSecrets -}}
{{- $namespace := .Release.Namespace }}
{{- range $key, $value := $allKubeSecrets }}
---
apiVersion: {{ include "common.capabilities.externalSecret.apiVersion" $ }}
kind: ExternalSecret
metadata:
  name: {{ $key }}-vault
  namespace: {{ $namespace }}
  labels: {{ include "common.labels.standard" $ | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretStoreRef:
    name: {{ $.Values.global.secretStore | quote }}
    kind: ClusterSecretStore
  target:
    name: {{ $key }}-vault
  data:
  {{- $allVaultSecrets := default (dict) $value -}}
  {{- range $vaultValue := $allVaultSecrets }}
  - secretKey: {{ $vaultValue.name }}
    remoteRef:
      key: {{ $.Values.global.environment }}/{{ $vaultValue.path }}
      property: {{ default $vaultValue.name $vaultValue.secret }}
  {{ end -}}
{{ end -}}
