{{- if and .Values.metrics.enabled .Values.metrics.rules.enabled }}
apiVersion: {{ include "common.capabilities.prometheusOperator.apiVersion" $ }}
kind: PrometheusRule
metadata:
  name: {{ include "common.names.fullname" . }}
  namespace: {{ .Values.metrics.rules.namespace | quote }}
  labels: {{- include "common.labels.standard" . | nindent 4 }}
spec:
  groups:
  - name: {{ include "common.names.fullname" . }}
    rules: {{ toYaml .Values.metrics.rules.spec | nindent 6 }}
{{- end }}
