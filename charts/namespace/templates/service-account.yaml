{{- $secrets := .Values.defaultServiceAccount.imagePullSecrets }}
{{- if .Values.registrySecret.enabled }}{{ $secrets = prepend $secrets .Values.registrySecret.name }}{{ end }}
{{- if and .Values.defaultServiceAccount.enabled $secrets }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: {{ .Release.Namespace }}
automountServiceAccountToken: {{ .Values.defaultServiceAccount.automountServiceAccountToken }}
imagePullSecrets:
  {{- range $secrets | uniq }}
  - name: {{ . }}
  {{- end }}
{{- end }}
