{{- if and .Values.ingress.enabled .Values.ingress.traefik.enabled .Values.service.enabled ( eq .Values.service.type "ClusterIP") -}}
{{- $match := ternary "Path" "PathPrefix" (eq .Values.ingress.pathType "Exact") -}}
{{- $host := include "common.ingress.host" . -}}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "common.ingress.name" (dict "name" .Values.ingress.name "default" (include "common.names.fullname" .) "context" $) }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{ include "common.labels.standard" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" . "context" $ ) | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- with .Values.ingress.traefik.entryPoints }}
  entryPoints: {{- toYaml . | nindent 4 }}
  {{- end }}
  routes:
    {{- $hosts := list (dict "host" $host "service" (include "common.ingress.serviceName" .)) }}
    {{- if and (eq .Values.rollouts.strategy "blueGreen") .Values.rollouts.enabled }}
    {{- $hosts = append $hosts (dict "host" (printf "preview-%s" $host) "service" (include "common.ingress.previewServiceName" .)) }}
    {{- end }}
    {{- range $hosts }}
    - kind: Rule
      match: Host(`{{ .host }}`) && {{ $match }}(`{{ $.Values.ingress.path }}`)
      {{- with $.Values.ingress.traefik.middlewares }}
      middlewares: {{- toYaml . | nindent 8 }}
      {{- end }}
      services:
        - name: {{ .service }}
          port: http
    {{- end }}
  {{- with .Values.ingress.traefik.tls }}
  tls: {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
