{{- if .Values.podLogs.enabled }}
apiVersion: {{ include "common.capabilities.podlogs.apiVersion" $ }}
kind: PodLogs
metadata:
  name: {{ include "common.names.fullname" . }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{ include "common.labels.standard" . | nindent 4 }}
spec:
  namespaceSelector:
    matchNames:
      - {{ include "common.names.namespace" . | quote }}
  selector:
    matchLabels: {{ include "common.labels.matchLabels" (dict "customLabels" .Values.podLabels "context" $) | nindent 6 }}
  relabelings: {{- include "common.logs.relabelings" $ | nindent 4 }}
  {{- with .Values.podLogs.pipelineStages }}
  pipelineStages: {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
  {{- end }}
{{- end }}
