---
# yaml-language-server: $schema=values.schema.json
# Default values for typical microservice.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

## @section Global parameters
## Global Docker image parameters
global:
  ## @param global.enabled Skips the install when the parent chart sets `condition: global.enabled` on the dependency
  ##
  enabled: true
  ## @param global.serviceName Name of the service. Affects public DNS.
  ## E.g. cherry-admin, tpt-service-api
  ##
  serviceName: "example"
  ## @param global.secretStore Name of the ClusterSecretStore used by ExternalSecrets for Vault secrets
  ##
  secretStore: "vault"
  ## @param global.environment Name of the environment, one of "dev", "stage", "prod".
  ##
  environment: "dev"
  ## @param global.domain Company Root-level domain, expects
  ## [<global.environment>].<global.domain> Route53 HZ.
  ##
  domain: ""
  ## Configuration of the image for the deployment
  ##
  image:
    ## @param global.image.registry Image registry, E.g. 1234567890.dkr.ecr.eu-central-1.amazonaws.com
    ##
    registry: ""
    ## @param global.image.repository Image repository, E.g. k8s/example-service
    ##
    repository: ""
    ## @param global.image.tag Tag of the image
    ##
    tag: "latest"
    ## @param global.image.pullPolicy The default pull policy is IfNotPresent which causes
    ## the kubelet to skip pulling an image if it already exists.
    ## Ref: https://kubernetes.io/docs/concepts/containers/images/#updating-images
    ##
    pullPolicy: "IfNotPresent"
    ## @param global.image.pullSecrets Optionally specify an array of imagePullSecrets.
    ## Secrets must be manually created in the namespace.
    ## ref: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
    ##
    ## pullSecrets:
    ##   - myRegistryKeySecretName
    ##
    pullSecrets: [ ]
## @section Common parameters
## @param nameOverride By default, name uses '{{ .Chart.Name }}'.
## This overrides that and uses the given string instead.
##
nameOverride: ""
## @param fullnameOverride By default, fullname uses '{{ .Release.Name }}-{{ .Chart.Name }}'.
## This overrides that and uses the given string instead.
##
fullnameOverride: ""
## @param namespaceOverride Override the namespace of all rendered resources (defaults to the release namespace)
##
namespaceOverride: ""
## @param replicaCount Number of the parallel-running containers. The controller will eventually make the size of the
## running service equal to the expected size.
##
replicaCount: 1
## @param revisionHistoryLimit Number of old ReplicaSets to retain for rollback
##
revisionHistoryLimit: 2
## @param commonLabels Labels to add to all deployed objects
##
commonLabels: {}
## @param commonAnnotations Annotations to add to all deployed objects
##
commonAnnotations: {}
## @param podLabels Additional labels for the pod
##
podLabels: {}
## @param podAnnotations Additional annotations for the pod.
##
podAnnotations: { }
# @schema
# type: [integer, string]
# @schema
## @param terminationGracePeriodSeconds Seconds the pod needs to gracefully terminate (cluster default when empty)
## ref: https://kubernetes.io/docs/concepts/containers/container-lifecycle-hooks/#hook-handler-execution
##
terminationGracePeriodSeconds: ""
## @param priorityClassName priorityClassName
##
priorityClassName: ""
## @extra podSecurityContext Pod security context
## Ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-security-context-for-a-pod
##
podSecurityContext:
  ## @param podSecurityContext.runAsUser The UID to run the entrypoint of the container process
  ##
  runAsUser: 1000
  ## @param podSecurityContext.runAsNonRoot Indicates that the container must run as a non-root user
  ##
  runAsNonRoot: true
  ## @param podSecurityContext.runAsGroup The GID to run the entrypoint of the container process
  ##
  runAsGroup: 65534
  ## @param podSecurityContext.fsGroup A special supplemental group that applies to all containers in a pod
  ##
  fsGroup: 65534
## @extra securityContext Container security context
## Ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-security-context-for-a-container
##
securityContext:
  ## @param securityContext.allowPrivilegeEscalation Controls whether a process can gain more privileges than its parent process
  ##
  allowPrivilegeEscalation: false
  ## @param securityContext.readOnlyRootFilesystem  Mounts the container's root filesystem as read-only
  ##
  readOnlyRootFilesystem: true
  ## @param securityContext.runAsUser The UID to run the entrypoint of the container process
  ##
  runAsUser: 1000
  ## @param securityContext.runAsNonRoot Indicates that the container must run as a non-root user
  ##
  runAsNonRoot: true
  ## @param securityContext.runAsGroup The GID to run the entrypoint of the container process
  ##
  runAsGroup: 65534
  ## @section securityContext.capabilities Grant certain privileges to a process without granting all the privileges of the root user
  capabilities:
    ## @param securityContext.capabilities.drop Drop all capabilities by default
    drop: [ "ALL" ]
## @param vaultVolumesSupport support for vault secrets as files. Defaults false.
##
vaultVolumesSupport: false
## @param volumes Container volumes configuration
## e.g.:
## volumes:
##   shared-files:
##     mountPath: /tmp/shared
##     emptyDir: true
##   shm:
##     mountPath: /dev/shm
##     emptyDir: true
##     inMemory: true # backs the emptyDir with tmpfs (medium: Memory)
##   central-config:
##     mountPath: /central-config
##     configMap:
##       application.yaml: |
##         configserver:
##           name:  JHipster Registry
##           status: Connected to the JHipster Registry running in Kubernetes
##  credentials:
##    mountPath: /var/lib/.key
##    secretName: kubernetes-secret
##  vaultCredentials:
##    mountPath: /var/lib
##    vaultPath: my_secret_files
##    items:
##      - key.pass
##  vault-ca:
##    mountPath: /etc/vault
##    readOnly: true # always set for secretName, vaultPath and hostPath
##    configMapName: vault-ca-bundle # an existing ConfigMap, optionally with native `items`
##    items:
##      - key: ca.crt
##        path: ca.crt
##  vault-token:
##    mountPath: /var/run/secrets/vault
##    projected: # native projected volume spec
##      sources:
##        - serviceAccountToken:
##            path: token
##            audience: vault
##            expirationSeconds: 3600
volumes: { }
## @param command You can set a custom entrypoint for your docker container
##
command: [ ]
## @param args You can set a custom arguments for your docker container
##
args: [ ]
## @param nodeSelector Node labels for pod assignment
## Ref: https://kubernetes.io/docs/user-guide/node-selection/
##
nodeSelector: { }
## @param tolerations Tolerations for pod assignment
## Ref: https://kubernetes.io/docs/concepts/configuration/taint-and-toleration/
##
tolerations: [ ]
## @extra podAffinity Pod affinity. Ignored if `affinity` is set
## Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#inter-pod-affinity-and-anti-affinity
##
podAffinity:
  ## @param podAffinity.preset Preset type: soft (preferred), hard (required) or disabled
  ##
  preset: disabled
  ## @param podAffinity.topologyKey Topology key of the affinity term
  ##
  topologyKey: kubernetes.io/hostname
## @extra podAntiAffinity Pod anti-affinity. Ignored if `affinity` is set
## Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#inter-pod-affinity-and-anti-affinity
##
podAntiAffinity:
  ## @param podAntiAffinity.preset Preset type: soft (preferred), hard (required) or disabled
  ##
  preset: soft
  ## @param podAntiAffinity.topologyKey Topology key of the affinity term
  ##
  topologyKey: kubernetes.io/hostname
## @param preStopDelaySeconds pre-stop delay for graceful pod shutdown
## Ref: https://kubernetes.io/docs/concepts/containers/container-lifecycle-hooks/
##
preStopDelaySeconds: 0
## @extra basicAuth Enable basic authentication
## Usage:
## env:
##   secret:
##     BASIC_AUTH_USERNAME:
##       name: {{ basicAuth.secretName }}
##       secret: username
##     BASIC_AUTH_PASSWORD:
##       name: {{ basicAuth.secretName }}
##       secret: password
##
basicAuth:
  ## @param basicAuth.enabled Enable basic authentication
  ##
  enabled: false
  ## @param basicAuth.username Username for basic authentication
  ##
  username: admin
  ## @param basicAuth.password Password for basic authentication
  ##
  password: ""
  ## @param basicAuth.secretName Name of the existing secret containing the basic auth credentials
  ##
  secretName: basic-auth
## @extra nodeAffinityPreset Node affinity preset
## Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#node-affinity
##
nodeAffinityPreset:
  ## @param nodeAffinityPreset.type Node affinity preset type. Ignored if `affinity` is set. Allowed values: `soft` or `hard`
  ##
  type: ""
  ## @param nodeAffinityPreset.key Node label key to match Ignored if `affinity` is set.
  ## E.g.
  ## key: "topology.kubernetes.io/zone"
  ##
  key: ""
  ## @param nodeAffinityPreset.values Node label values to match. Ignored if `affinity` is set.
  ## E.g.
  ## values:
  ##   - eu-central-1a
  ##   - eu-central-1b
  ##   - eu-central-1c
  ##
  values: [ ]
## @param affinity Affinity for pod assignment
## Ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/#affinity-and-anti-affinity
## Note: podAffinity, podAntiAffinity and nodeAffinityPreset will be ignored when it's set
##
affinity: { }
## @extra topologySpread Control spread of pods across topology domains (zones, nodes, etc.)
## Ref: https://kubernetes.io/docs/concepts/scheduling-eviction/topology-spread-constraints/#topologyspreadconstraints-field
##
topologySpread:
  ## @param topologySpread.preset Spread mode: soft (ScheduleAnyway), hard (DoNotSchedule), custom (use constraints) or disabled
  ##
  preset: soft
  ## @param topologySpread.topologyKey Topology key for soft/hard presets
  ##
  topologyKey: topology.kubernetes.io/zone
  ## @param topologySpread.maxSkew Override maxSkew for soft/hard presets (default: 1, soft with 10+ autoscaling replicas: 2)
  ##
  maxSkew: ""
  ## @param topologySpread.constraints Raw topologySpreadConstraints, used only when preset is custom (supports templating)
  ##
  constraints: []
## @param resourcesPreset Set container resources according to one common preset (allowed values: none, nano, micro, small, medium, large, xlarge, 2xlarge).
## This is ignored if resources is set (resources is recommended for production).
## More information: https://github.com/next-gen-infrastructure/kubernetes-helm-charts/blob/main/global/common/templates/_resources.tpl#L9
##
resourcesPreset: "none"
## @extra pdb Pod disruption budget configuration
## Ref: https://kubernetes.io/docs/concepts/workloads/pods/disruptions/
## minAvailable and maxUnavailable accept a number (1) or a percent string ("25%"); set only one, the other must be 0 or "".
##
pdb:
  ## @param pdb.create Specifies whether a Pod disruption budget should be created
  ##
  create: false
  # @schema
  # type: [integer, string]
  # @schema
  ## @param pdb.minAvailable Min available pods or percent of pods (number or string, e.g. 1 or "25%")
  ##
  minAvailable: 1
  # @schema
  # type: [integer, string]
  # @schema
  ## @param pdb.maxUnavailable Max non-available pods or percent of pods (number or string, e.g. 1 or "25%")
  ##
  maxUnavailable: 0
## @section Network policy
## Renders a CiliumNetworkPolicy (cilium=true) or a standard NetworkPolicy. Ingress is default-deny except the peers below.
## Egress stays open unless egress.fqdns or extraEgress is set; then only DNS (if allowed) and the listed rules pass.
## Ref: https://kubernetes.io/docs/concepts/services-networking/network-policies/
##
networkPolicy:
  ## @param networkPolicy.enabled Create a network policy for the pods
  ##
  enabled: false
  ## @param networkPolicy.cilium Render a CiliumNetworkPolicy (cilium.io/v2) instead of a NetworkPolicy. Requires the Cilium CRDs
  ##
  cilium: true
  ## @param networkPolicy.allowIngressFromIngressController Allow traffic from the namespace in ingressControllerNamespace
  ##
  allowIngressFromIngressController: true
  ## @param networkPolicy.ingressControllerNamespace Namespace of the ingress controller
  ##
  ingressControllerNamespace: kube-system
  ## @param networkPolicy.allowSameNamespace Allow traffic from the release namespace
  ##
  allowSameNamespace: true
  ## @param networkPolicy.allowPodSelectors Pods of the release namespace allowed in, as label maps, e.g. [{app.kubernetes.io/name: frontend}]. Used only when allowSameNamespace is false
  ##
  allowPodSelectors: []
  ## @param networkPolicy.allowedNamespaces Additional namespaces allowed to reach the pods
  ##
  allowedNamespaces: []
  ## @param networkPolicy.egress.allowDNS Allow DNS to kube-dns when egress is restricted
  ## @param networkPolicy.egress.fqdns Hostnames pods may reach, e.g. ["api.stripe.com", "*.amazonaws.com"]. Cilium only
  ##
  egress:
    allowDNS: true
    fqdns: []
  ## @param networkPolicy.extraIngress Raw ingress rules in the native format of the selected kind (supports templating)
  ##
  extraIngress: []
  ## @param networkPolicy.extraEgress Raw egress rules in the native format of the selected kind (supports templating)
  ##
  extraEgress: []
## @section Extra Containers
## @param initContainers Configuration for the init container
##
## E.g.
## initContainers:
##   - nameOverride: foo
##     image:
##       name: ""
##       tag: ""
##       pullPolicy: "IfNotPresent"
##     command: []
##     args: []
##     resources: {}
##     inheritEnv: false # true: merge the main container's env (incl. vaultSecret) into this one
##
initContainers: [ ]
## @param sidecarContainers Configuration for the init container
##
## E.g.
## sidecarContainers:
##   - nameOverride: foo
##     image:
##       name: ""
##       tag: ""
##       pullPolicy: "IfNotPresent"
##     command: []
##     args: []
##     resources: {}
##     inheritEnv: false # true: merge the main container's env (incl. vaultSecret) into this one
##
sidecarContainers: [ ]
## @param datadogIntegration Enable datadog related integration for tracing
## E.g.
## datadogIntegration: true
datadogIntegration: false
## @param githubActionsIntegration Allow github runners to create resources in namespace
## E.g.
## githubActionsIntegration: true
githubActionsIntegration: false
## @param resources Container resource requests and limits
## ref: https://kubernetes.io/docs/user-guide/compute-resources/
##
## E.g.
## resources:
##   requests:
##     cpu: 10m
##     memory: 50Mi
##   limits:
##     cpu: 50m
##     memory: 50Mi
resources: {}
## @section Image for the deployment
##
image:
  ## @param image.registry Image registry, E.g. 1234567890.dkr.ecr.eu-central-1.amazonaws.com
  ##
  registry: ""
  ## @param image.repository Image repository, E.g. k8s/example-service
  ##
  repository: ""
  ## @param image.tag Tag of the image
  ##
  tag: ""
  ## @param image.pullPolicy The default pull policy is IfNotPresent which causes
  ## the kubelet to skip pulling an image if it already exists.
  ## Ref: https://kubernetes.io/docs/concepts/containers/images/#updating-images
  ##
  pullPolicy: ""
  ## @param image.pullSecrets Optionally specify an array of imagePullSecrets.
  ## Secrets must be manually created in the namespace.
  ## ref: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
  ##
  ## pullSecrets:
  ##   - myRegistryKeySecretName
  ##
  pullSecrets: [ ]
## @section Configure Service Accounts for Pod
## Ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/
serviceAccount:
  ## @param serviceAccount.create Specifies whether a service account should be created
  ##
  create: false
  ## @param serviceAccount.annotations Annotations to add to the service account
  ##
  annotations: { }
  ## @param serviceAccount.name The name of the service account to use.
  ## If not set and create is true, a name is generated using the fullname template
  ##
  name: ""
  # @schema
  # type: [boolean, "null"]
  # @schema
  ## @param serviceAccount.automountServiceAccountToken Set to false to not mount the API token, unset keeps the default
  ##
  automountServiceAccountToken: null
## @section Environment variables that get added to the container
env:
  ## @param env.values generic Environment variables that get added to the container
  ## Supporting helm templates
  ## E.g.
  ## values:
  ##   FOO: "bar-{{ .Values.global.environment }}"
  ##
  values: { }
  ## @param env.refs Environment variables as references to the pod
  ## E.g.
  ## refs:
  ##   FOO: metadata.name
  ##
  refs: { }
  ## @param env.configmap Environment variables that get added to the container from ConfigMap
  ## E.g.
  ## configmap:
  ##   API_CONFIG:
  ##     name: myConfigMap
  ##     key: foo.txt
  ##
  configmap: { }
  ## @param env.secret Kubernetes secrets that get added to the container
  ## E.g.
  ## secret:
  ##   API_PASSWORD:
  ##     name: mySecret
  ##     secret: password
  ##
  secret: { }
  ## @param env.vaultSecret Kubernetes secrets that get added to the container from Hashicorp Vault
  ## path - Path within vault to the secret containing environment variable. It will be found in Vault at <env>/<path> (store: global.secretStore)
  ## secret - Optional name of the variable inside secret. Defaults to the secret key
  ## E.g.
  ## vaultSecret:
  ##  API_KEY:
  ##    path: mySecret
  ##    secret: password
  ##
  vaultSecret: { }
## @param envFrom Sources of environment variables for the container (configMapRef / secretRef). Supports helm templates
## E.g.
## envFrom:
##   - configMapRef:
##       name: global-configmap
##   - secretRef:
##       name: global-secret
##
envFrom: [ ]
## @section ConfigMap with environment variables for the container
##
configMap:
  ## @param configMap.enabled Create a ConfigMap from configMap.data and load it into the container via envFrom
  ##
  enabled: false
  ## @param configMap.data Key-value pairs of the ConfigMap
  ## E.g.
  ## data:
  ##   key1: value1
  ##
  data: { }
## @section Configuration of the service
##
service:
  ## @param service.enabled If service should be created to expose Pod.
  ##
  enabled: true
  ## @param service.name If you need to specify a service's full name override.
  ##
  name: ""
  ## @param service.type Type of the service. One of ClusterIP, NodePort, LoadBalancer.
  ## Ref: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  ##
  type: "ClusterIP"
  ## @param service.ports Configuration of the service ports
  ## E.g.
  ## ports:
  ##   http:
  ##     port: 80
  ##     protocol: TCP
  ##     containerPort: 3000
  ##   https: 443
  ports: { }
  ## @param  service.healthCheckPath default HTTP Health check for container liveness and readiness.
  ##
  healthCheckPath: "/"
  ## @param service.loadBalancerSourceRanges Address(es) that are allowed when service is LoadBalancer
  ## ref: https://kubernetes.io/docs/tasks/access-application-cluster/configure-cloud-provider-firewall/#restrict-access-for-loadbalancer-service
  ## Example:
  ## loadBalancerSourceRanges:
  ## - 10.10.10.0/24
  ##
  loadBalancerSourceRanges: [ ]
  ## @param service.sessionAffinity Session affinity of the service, None or ClientIP. ClientIP pins a client IP to one pod; behind an ingress controller that is the controller's IP, so load gets uneven
  ## Ref: https://kubernetes.io/docs/reference/networking/virtual-ips/#session-affinity
  ##
  sessionAffinity: None
  ## @param service.annotations Service annotations
  ##
  annotations: { }
## @section Container liveness configuration.
## Ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-probes/#configure-probes
##
livenessProbe:
  ## @param livenessProbe.enabled Enable livenessProbe
  ##
  enabled: true
  ## @param livenessProbe.healthCheckPath Request path for livenessProbe
  ##
  healthCheckPath: ""
  ## @param livenessProbe.tcpSocket Check availability on transport level via port
  ## E.g.
  ## tcpSocket: 80
  ##
  tcpSocket: 0
  ## @param livenessProbe.initialDelaySeconds Initial delay seconds for livenessProbe
  ##
  initialDelaySeconds: 10
  ## @param livenessProbe.failureThreshold Failure threshold for livenessProbe
  ##
  failureThreshold: 3
  ## @param livenessProbe.periodSeconds Period seconds for livenessProbe
  ##
  periodSeconds: 10
  ## @param livenessProbe.successThreshold Success threshold for livenessProbe
  ##
  successThreshold: 1
  ## @param livenessProbe.timeoutSeconds Timeout seconds for livenessProbe
  ##
  timeoutSeconds: 1
## @section Container readiness configuration.
## Ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-probes/#configure-probes
##
readinessProbe:
  ## @param readinessProbe.enabled Enable readinessProbe
  ##
  enabled: true
  ## @param readinessProbe.healthCheckPath Request path for readinessProbe
  ##
  healthCheckPath: ""
  ## @param readinessProbe.tcpSocket Check availability on transport level via port
  ## E.g.
  ## tcpSocket: 80
  ##
  tcpSocket: 0
  ## @param readinessProbe.failureThreshold Failure threshold for readinessProbe
  ##
  failureThreshold: 3
  ## @param readinessProbe.initialDelaySeconds Initial delay seconds for readinessProbe
  ##
  initialDelaySeconds: 10
  ## @param readinessProbe.periodSeconds Period seconds for readinessProbe
  ##
  periodSeconds: 10
  ## @param readinessProbe.successThreshold Success threshold for readinessProbe
  ##
  successThreshold: 1
  ## @param readinessProbe.timeoutSeconds Timeout seconds for readinessProbe
  ##
  timeoutSeconds: 1
## @section Container startUp configuration.
## Ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-probes/#configure-probes
##
startupProbe:
  ## @param startupProbe.enabled Enable readinessProbe
  ##
  enabled: false
  ## @param startupProbe.healthCheckPath Request path for readinessProbe
  ##
  healthCheckPath: ""
  ## @param startupProbe.tcpSocket Check availability on transport level via port
  ## E.g.
  ## tcpSocket: 80
  ##
  tcpSocket: 0
  ## @param startupProbe.failureThreshold Failure threshold for readinessProbe
  ##
  failureThreshold: 3
  ## @param startupProbe.initialDelaySeconds Initial delay seconds for readinessProbe
  ##
  initialDelaySeconds: 10
  ## @param startupProbe.periodSeconds Period seconds for readinessProbe
  ##
  periodSeconds: 10
  ## @param startupProbe.successThreshold Success threshold for readinessProbe
  ##
  successThreshold: 1
  ## @param startupProbe.timeoutSeconds Timeout seconds for readinessProbe
  ##
  timeoutSeconds: 1
## @section Configuration for the main load-balancer
##
ingress:
  ## @param ingress.enabled If service will be accessible outside of Kubernetes environment
  ##
  enabled: false
  ## @param ingress.name If you need to specify an ingress's full name override.
  ##
  name: ""
  ## @param ingress.className Name of the ingress Class.
  ##
  className: traefik
  ## @param ingress.pathType Type of the path (available options "ImplementationSpecific", "Exact", "Prefix")
  ##
  pathType: Prefix
  ## @param ingress.subDomain If DNS has environment as sub-domain.
  ## The default DNS is constructed as:
  ## <global.serviceName>.[<global.environment>].<global.domain>
  ##
  subDomain: false
  ## @param ingress.hostPrefix Host label placed before the domain, replaces <global.serviceName> when set.
  ## The host is constructed as: <hostPrefix>.[<global.environment>].<global.domain>
  ##
  hostPrefix: ""
  ## @param ingress.path Prefix for the path routing
  ##
  path: "/"
  ## @param ingress.annotations Ingress annotations
  ##
  annotations: { }
  traefik:
    ## @param ingress.traefik.enabled Render a Traefik IngressRoute (traefik.io/v1alpha1) instead of an Ingress.
    ##
    enabled: false
    ## @param ingress.traefik.entryPoints Traefik entry points the route is attached to
    ##
    entryPoints:
      - websecure
    ## @param ingress.traefik.middlewares Traefik middlewares applied to the route.
    ## E.g.
    ## middlewares:
    ##   - name: redirect
    ##     namespace: infra
    ##
    middlewares: [ ]
    ## @param ingress.traefik.tls IngressRoute tls block.
    ## E.g.
    ## tls:
    ##   certResolver: le
    ##
    tls: { }
  ## @param ingress.extraHosts Extra hosts for ingress
  ## E.g.
  ## extraHosts:
  ## - host: example.local
  ##   port: http
  ##   paths: []
  ##
  extraHosts: [ ]
## @section Configuration for the extra load-balancer
##
ingressExtra:
  ## @param ingressExtra.enabled If service will be accessible outside of Kubernetes environment
  ##
  enabled: false
  ## @param ingressExtra.name If you need to specify an extra ingress's full name override.
  ##
  name: ""
  ## @param ingressExtra.pathType Type of the path (available options "ImplementationSpecific", "Exact", "Prefix")
  ##
  pathType: Prefix
  ## @param ingressExtra.subDomain If DNS has environment as sub-domain.
  ## The default DNS is constructed as:
  ## <global.serviceName>.[<global.environment>].<global.domain>
  ##
  subDomain: false
  ## @param ingressExtra.host DNS for the application external access
  ##
  host: ""
  ## @param ingressExtra.path Prefix for the path routing
  ##
  path: "/"
  ## @param ingressExtra.annotations Ingress annotations
  ##
  annotations: { }
  ## @param ingressExtra.extraHosts Extra hosts for ingress
  ## E.g.
  ## extraHosts:
  ## - host: example.local
  ##   port: http
  ##   paths: []
  ##
  extraHosts: [ ]
## @section RBAC management
rbac:
  ## @param rbac.create Specifies whether RBAC resources should be created
  ##
  create: true
  ## @param rbac.rules Custom RBAC rules to set
  ## e.g:
  ## rules:
  ##   - apiGroups:
  ##       - ""
  ##     resources:
  ##       - pods
  ##     verbs:
  ##       - get
  ##       - list
  ##
  rules: [ ]
## @section Prometheus Exporter / Metrics
##
metrics:
  ## @param metrics.enabled Enable prometheus to access metrics endpoint
  ##
  enabled: false
  ## @param metrics.path Path to the prometheus metrics endpoint
  ##
  path: /metrics
  ## @param metrics.port Name of the service port for metrics
  ##
  port: http
  ## @param metrics.prometheusNamespace Namespace of Prometheus. When networkPolicy is enabled it may reach the metrics port from there
  ##
  prometheusNamespace: monitoring
  ## Prometheus Operator ServiceMonitor configuration
  ##
  serviceMonitor:
    ## @param metrics.serviceMonitor.enabled Create ServiceMonitor object
    ##
    enabled: false
    ## @param metrics.serviceMonitor.interval Interval at which metrics should be scraped
    ## ref: https://github.com/coreos/prometheus-operator/blob/master/Documentation/api.md#endpoint
    ##
    interval: 10s
    ## @param metrics.serviceMonitor.scrapeTimeout Timeout after which the scrape is ended
    ## ref: https://github.com/coreos/prometheus-operator/blob/master/Documentation/api.md#endpoint
    ##
    scrapeTimeout: 3s
    ## @param metrics.serviceMonitor.params URL query parameters of the scrape request, as lists of values
    ## e.g:
    ## params:
    ##   format:
    ##     - prometheus
    ##
    params: { }
    ## @param metrics.serviceMonitor.tlsConfig TLS settings of the scrape request, used with an https endpoint
    ## ref: https://prometheus-operator.dev/docs/api-reference/api/#monitoring.coreos.com/v1.SafeTLSConfig
    ## e.g:
    ## tlsConfig:
    ##   insecureSkipVerify: true
    ##
    tlsConfig: { }
    ## @param metrics.serviceMonitor.selector Additional labels for ServiceMonitor object
    ## ref: https://github.com/bitnami/charts/tree/master/bitnami/prometheus-operator#prometheus-configuration
    ## e.g:
    ## selector:
    ##   prometheus: my-prometheus
    ##
    selector: { }
  ## Prometheus Operator PrometheusRules configuration
  ##
  rules:
    ## @param metrics.rules.enabled Create PrometheusRules object
    ##
    enabled: false
    ## @param metrics.rules.namespace Namespace of the PrometheusRules object
    ##
    namespace: monitoring
    ## @param metrics.rules.spec Configuration for the application alerting
    ## Ref: https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/api.md#prometheusrulespec
    ## E.g.
    ## spec:
    ## - alert: ApplicationUnstable
    ##   expr: |
    ##     absent(example_app_info)
    ##   for: 15m
    ##   labels:
    ##     severity: critical
    ##   annotations:
    ##     summary: "[Example] No reported applications"
    ##     description: >
    ##       Example has not reported any applications data for the past 15 minutes which
    ##       means that it must be down or not functioning properly. This needs to be
    ##       resolved for this cloud to continue to maintain state.
    ##
    spec: [ ]
## @section Lifecycle configuration
## ref: https://kubernetes.io/docs/tasks/configure-pod-container/attach-handler-lifecycle-event/
lifecycle:
  ## @param lifecycle.enabled Enable lifecycle hooks
  ##
  enabled: false
  ## @param lifecycle.postStartCommand Command to be executed after the container start
  ## E.g.
  ## postStartCommand: echo 'Hello!'
  ##
  postStartCommand: ""
  ## @param lifecycle.preStopCommand Command to be executed before container shutdown
  ## E.g.
  ## preStopCommand: echo 'Bye!'
  ##
  preStopCommand: ""
## @section Create HorizontalPodAutoscaler (or KEDA ScaledObject) for the workload
## Ref: https://kubernetes.io/docs/tasks/run-application/horizontal-pod-autoscale/
##
autoscaling:
  ## @param autoscaling.enabled If autoscaling is enabled
  ##
  enabled: false
  ## @param autoscaling.minReplicas Min number of pod replicas
  ##
  minReplicas: 1
  ## @param autoscaling.maxReplicas Max number of pod replicas
  ##
  maxReplicas: 1
  ## @param autoscaling.metrics Configuration of scaling metrics
  ## E.g.
  ## metrics:
  ## - type: Resource
  ##   resource:
  ##     name: cpu
  ##     target:
  ##       type: Utilization
  ##       averageUtilization: 60
  ## - type: Resource
  ##   resource:
  ##     name: memory
  ##       type: Utilization
  ##       averageUtilization: 60
  ##
  metrics: [ ]
  ## @param autoscaling.behavior HPA Behavior
  ##
  ## E.g.
  ## behavior:
  ##   scaleDown:
  ##     stabilizationWindowSeconds: 300
  ##     policies:
  ##       - type: Percent
  ##         value: 100
  ##         periodSeconds: 15
  ##   scaleUp:
  ##     stabilizationWindowSeconds: 10
  ##     policies:
  ##       - type: Percent
  ##         value: 100
  ##         periodSeconds: 15
  ##       - type: Pods
  ##         value: 4
  ##         periodSeconds: 15
  ##     selectPolicy: Max
  behavior: { }
  keda:
    ## @param autoscaling.keda.enabled Render a KEDA ScaledObject (keda.sh/v1alpha1) instead of an HPA. Requires autoscaling.enabled and the KEDA CRDs; autoscaling.metrics is ignored, use triggers
    ##
    enabled: false
    ## @param autoscaling.keda.pollingInterval Seconds between trigger checks
    ##
    pollingInterval: 30
    ## @param autoscaling.keda.cooldownPeriod Seconds to wait after the last active trigger before scaling to zero
    ##
    cooldownPeriod: 300
    ## @param autoscaling.keda.triggers KEDA triggers, in the native format. autoscaling.behavior is passed to the managed HPA
    ## E.g.
    ## triggers:
    ## - type: cpu
    ##   metricType: Utilization
    ##   metadata:
    ##     value: "60"
    ##
    triggers: []
    ## @param autoscaling.keda.advanced Raw ScaledObject spec.advanced block (e.g. horizontalPodAutoscalerConfig, scalingModifiers)
    ##
    advanced: {}
## @section Persistence Parameters
## ref: https://kubernetes.io/docs/user-guide/persistent-volumes/
##
persistence:
  ## @param persistence.enabled Enable persistence using Persistent Volume Claims
  ##
  enabled: false
  ## @param persistence.path Path to mount persistent volume
  ##
  path: ""
  ## @param persistence.storageClass Persistent Volume storage class
  ## If defined, storageClassName: <storageClass>
  storageClass: ""
  ## @param persistence.annotations Additional custom annotations for the PVC
  ##
  annotations: { }
  ## @param persistence.accessModes [array] Persistent Volume access modes
  ##
  accessModes:
    - ReadWriteOnce
  ## @param persistence.size Persistent Volume size
  ##
  size: 8Gi
## @section Configuration for Argo Rollouts
## Ref: https://argoproj.github.io/argo-rollouts/
##
rollouts:
  ## @param rollouts.enabled If Argo Rollouts will be created instead of Deployment
  ##
  enabled: false
  ## @param rollouts.strategy Argo Rollouts strategy. Allowed values: `canary` or `blueGreen`
  ##
  strategy: canary
  ## @param rollouts.steps Steps define sequence of steps to take during an update of the canary.
  ## Skipped upon initial deploy of a rollout.
  ## Note: steps will be ignored if rollouts.strategy is set to `blueGreen`
  ## E.g.
  ## steps:
  ## - setWeight: 20
  ## - pause: {}
  ## - setWeight: 40
  ## - pause: {duration: 10s}
  ## - setWeight: 60
  ## - pause: {duration: 10m}
  ## - setWeight: 80
  ## - pause: {duration: 10h}
  ##
  steps: [ ]
  ## @param rollouts.autoPromotionEnabled Indicates if the rollout should automatically promote the new ReplicaSet
  ## to the active service or enter a paused state. If not specified, the
  ## default value is true.
  ## Note: autoPromotionEnabled will be ignored if rollouts.strategy is set to `canary`
  ##
  autoPromotionEnabled: true
  ## @param rollouts.autoPromotionSeconds Automatically promotes the current ReplicaSet to active after the
  ## specified pause delay in seconds after the ReplicaSet becomes ready.
  ## If omitted, the Rollout enters and remains in a paused state until
  ## manually resumed by resetting spec.Paused to false.
  ## Note: autoPromotionSeconds will be ignored if rollouts.strategy is set to `canary`
  ##
  autoPromotionSeconds: 0
  ## @param rollouts.scaleDownDelaySeconds Adds a delay before scaling down the previous ReplicaSet. If omitted,
  ## the Rollout waits 30 seconds before scaling down the previous ReplicaSet.
  ## A minimum of 30 seconds is recommended to ensure IP table propagation
  ## across the nodes in a cluster.
  ## Note: scaleDownDelaySeconds will be ignored if rollouts.strategy is set to `canary`
  ##
  scaleDownDelaySeconds: 30
